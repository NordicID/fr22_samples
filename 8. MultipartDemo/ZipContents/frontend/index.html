<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>MultipartDemo</title>

		<!-- REQUIRED CSS -->
		<link rel="stylesheet" href="../../../static/core/fontawesome-free-5.13.0-web/css/all.min.css">
		<link rel="stylesheet" href="../../../static/core/adminlte/css/adminlte.min.css">
		<link rel="stylesheet" href="../../../static/core/fr22_plugin.css">
	</head>

	<body>
		<div class="content fade-in" style="padding: 10px">
			<div class="container-fluid">
				<div class="row">

					<div class="col colm">
						<div class="card card-outline">
							<div class="card-header">
								<h3 class="card-title text-secondary">Import</h3>
								<div class="card-tools">
									<button type="button" class="btn btn-tool" data-card-widget="maximize"> <i class="fas fa-expand"></i> </button>
									<button type="button" class="btn btn-tool" data-card-widget="collapse"> <i class="fas fa-minus"></i> </button>
								</div>
							</div>
							<div class="card-body">
								<form id="importForm" action="/api/builtin/settings/import" method="post" accept-charset="utf-8" enctype="multipart/form-data">
									<div class="form-group row">
                    <label class="col-sm col-form-label">Save to disk</label>
										<div class="form-check-inline">
											<input class="form-check-input" type="checkbox" id="savetodisk">
										</div>
									</div>
									<div class="form-group">
										<label class="col-form-label">File: </label>
										<label for="importFile" class="btn btn-primary">
											<input id="importFile" name="importFile" hidden class="form-control-file" type="file" value="" onchange="$('#upload-file-info').html(this.files[0].name)" />
											Browse
										</label>
										<span class='label label-info' id="upload-file-info"></span>
									</div>
									<div class="form-group">
										<div class="progress">
											<div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width:0%;color:black">0%</div>
										</div>
										<label>Import state: </label>
										<label id="importState"></label>
									</div>
								</form>
							</div>
							<div class="card-footer">
								<button class="btn btn-primary" type="button" value="importBut" id='importBut'> <i class="fas fa-file-import"></i> Import</button>
							</div>
						</div>
					</div>

					<div class="col colm">
						<div class="card card-outline">
							<div class="card-header">
								<h3 class="card-title text-secondary">Operations</h3>
								<div class="card-tools">
									<button type="button" class="btn btn-tool" data-card-widget="maximize"> <i class="fas fa-expand"></i> </button>
									<button type="button" class="btn btn-tool" data-card-widget="collapse"> <i class="fas fa-minus"></i> </button>
								</div>
							</div>
							<div class="card-body">
								<h3 class="card-title" id="filename">No file imported</h3>
							</div>
							<div class="card-footer">
								<button class="btn btn-primary" type="button" id="exportBut"> <i class="fa fa-file-export"></i> Export</button>
								<button class="btn btn-primary" type="button" id="deleteBut"> <i class="fa fa-trash"></i> Delete</button>
							</div>
						</div>
					</div>

				</div>
			</div>
		</div>


		<!-- REQUIRED SCRIPTS -->
		<script src="../../../static/core/jquery-3.5.0.min.js"></script>
		<script src="../../../static/core/bootstrap-4.3.1-dist/js/bootstrap.bundle.min.js"></script>
		<script src="../../../static/core/fr22_loader.js.nc"></script>

		<!-- PLUGIN SCRIPTS -->
    <script src="../../../static/application/MultipartDemo/multipart.js"></script>

	</body>
</html>
